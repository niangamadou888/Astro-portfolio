[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `netlify dev` otherwise probes Vite's default 5173 and times out.
[dev]
  command = "npm run dev"
  targetPort = 8080
  port = 8888

# Keeps the public URL stable and provider-agnostic. Declared explicitly (rather
# than via the function's own `config.path`) so ordering against any future
# catch-all redirect stays predictable.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true
